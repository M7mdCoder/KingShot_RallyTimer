<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>KingshotLab - Realtime Cloud Battle Station v6.29</title>

    <!-- Supabase JS CDN -->

</head>
<body class="bg-kingshot-dark text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white" onclick="unlockAudioMobile()">

    <!-- Role Selection Modal -->
    <div id="role-modal" class="fixed inset-0 bg-kingshot-dark/95 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-kingshot-card border border-kingshot-border rounded-2xl p-6 max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center mx-auto shadow-lg shadow-blue-500/30 border border-blue-400/30">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h2 class="gaming-font text-2xl font-bold tracking-wider text-white uppercase">KingshotLab V6.29</h2>
                <p class="text-xs text-slate-400 mt-1">Select your operational role to continue</p>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="handleRoleSelection('leader')" class="p-4 rounded-xl bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-500 hover:to-blue-600 text-white font-bold transition-all border border-blue-400/30 flex flex-col items-center gap-2 shadow-lg shadow-blue-600/20 active:scale-95 cursor-pointer">
                    <span class="text-2xl">👑</span>
                    <span class="gaming-font uppercase text-sm tracking-wide">Leader</span>
                </button>
                <button onclick="handleRoleSelection('player')" class="p-4 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold transition-all border border-emerald-400/30 flex flex-col items-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95 cursor-pointer">
                    <span class="text-2xl">🛡️</span>
                    <span class="gaming-font uppercase text-sm tracking-wide">Player</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-kingshot-card border-b border-kingshot-border shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-md border border-blue-400/30">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                    <h1 class="gaming-font text-lg font-bold tracking-wider text-white uppercase flex items-center gap-1.5">
                        KingshotLab <span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">V6.29</span>
                    </h1>
                </div>

                <div class="flex items-center gap-2">
                    <span id="connection-status" class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-pulse" title="Disconnected"></span>
                    <div class="bg-emerald-500/10 border border-emerald-500/30 px-2.5 py-1 rounded-lg text-emerald-400 font-bold text-xs uppercase tracking-wider">
                        ROOM: 1865
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-2 border-t border-kingshot-border/60">
                <div class="flex items-center gap-2">
                    <span id="current-role-badge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30 uppercase">Role: -</span>
                    <button onclick="resetRoleSelection()" class="text-[10px] text-slate-400 hover:text-white transition-colors underline uppercase cursor-pointer">Switch</button>
                </div>

                <button id="enable-audio-btn" onclick="enableAndTestAudio(event)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center gap-1.5 shadow-md shadow-amber-500/20 transition-all active:scale-95 whitespace-nowrap cursor-pointer">
                    🔊 Enable Audio
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl w-full mx-auto px-4 py-4 flex-grow space-y-4">

        <!-- GROUP CUSTOMIZATION PANEL (Leader Only) -->
        <div class="leader-only bg-kingshot-card border border-blue-500/30 rounded-xl p-4 shadow-lg space-y-3">
            <h2 class="gaming-font text-xs font-bold text-blue-400 uppercase tracking-wider">Groups Flexible Control Panel</h2>
            <div id="group-settings-container" class="space-y-2">
                <!-- Dynamically populated per group -->
            </div>
            
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-kingshot-border/60">
                <button onclick="speakCustomText('Get ready for battle')" class="bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white font-semibold py-2 px-3 rounded-lg text-xs transition-all border border-indigo-500/40 uppercase active:scale-95 cursor-pointer">
                    📢 Get Ready
                </button>
                <button onclick="speakCustomText('Return to chat')" class="bg-purple-600/30 hover:bg-purple-600 text-purple-300 hover:text-white font-semibold py-2 px-3 rounded-lg text-xs transition-all border border-purple-500/40 uppercase active:scale-95 cursor-pointer">
                    💬 Return to Chat
                </button>
            </div>
        </div>

        <!-- LIVE BATTLE STATION CONSOLE -->
        <div class="bg-kingshot-card border border-amber-500/40 rounded-xl p-4 shadow-xl space-y-3">
            <div class="flex flex-col gap-2">
                <h2 class="gaming-font text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    Live Sequence Console
                </h2>
                <div class="leader-only flex items-center justify-between gap-2">
                    <label class="text-[11px] text-slate-300 font-semibold uppercase">WAVE:</label>
                    <select id="battle-wave-select" class="bg-kingshot-dark border border-amber-500/30 rounded-lg px-3 py-1.5 text-slate-100 text-xs flex-1 outline-none">
                        <option value="all">All Active Players</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-2.5 bg-kingshot-dark/70 p-3 rounded-xl border border-kingshot-border">
                <div>
                    <div id="battle-status" class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">STATUS: STANDBY</div>
                    <div id="battle-current-target" class="gaming-font text-base font-bold text-amber-400 mt-0.5">Waiting for Leader...</div>
                </div>
                <div class="leader-only flex items-center gap-2 pt-1">
                    <button id="start-battle-btn" class="flex-1 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-bold py-2.5 px-4 rounded-xl shadow-lg shadow-amber-600/20 transition-all gaming-font text-xs uppercase tracking-wider border border-amber-400/30 active:scale-95 cursor-pointer">
                        🚀 Start Sequence
                    </button>
                    <button id="reset-battle-btn" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold py-2.5 px-3 rounded-xl border border-red-500/30 transition-all text-xs active:scale-95 cursor-pointer">
                        Reset
                    </button>
                </div>
            </div>

            <div id="battle-sequence-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>

        <!-- Add / Edit Player Form (Leader Only) -->
        <div class="leader-only bg-kingshot-card border border-kingshot-border rounded-xl p-4 shadow-xl">
            <h3 id="form-title" class="gaming-font text-xs font-bold text-slate-200 uppercase tracking-wider mb-2.5">Add Player</h3>
            <form id="add-player-form" class="space-y-3">
                <input type="hidden" id="edit-player-id" value="">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase text-slate-400 mb-1 font-semibold">Player Name</label>
                        <input type="text" id="player-name" required placeholder="e.g. sweet" class="w-full bg-kingshot-dark border border-kingshot-border rounded-lg px-3 py-2 text-slate-100 text-xs focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-slate-400 mb-1 font-semibold">Group</label>
                        <input type="text" id="player-group" value="1" required class="w-full bg-kingshot-dark border border-kingshot-border rounded-lg px-3 py-2 text-slate-100 text-xs focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] uppercase text-slate-400 mb-1 font-semibold">March (Mins)</label>
                        <input type="number" id="march-mins" min="0" value="1" required class="w-full bg-kingshot-dark border border-kingshot-border rounded-lg px-3 py-2 text-slate-100 text-xs focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase text-slate-400 mb-1 font-semibold">Seconds</label>
                        <input type="number" id="march-secs" min="0" max="59" value="20" required class="w-full bg-kingshot-dark border border-kingshot-border rounded-lg px-3 py-2 text-slate-100 text-xs focus:border-blue-500 outline-none">
                    </div>
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" id="form-submit-btn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md shadow-blue-600/20 transition-all text-xs uppercase border border-blue-400/30 active:scale-95 cursor-pointer">
                        Add Player
                    </button>
                    <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 px-3 rounded-xl text-xs uppercase active:scale-95 cursor-pointer">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Player Table (Leader Only) -->
        <div class="leader-only bg-kingshot-card border border-kingshot-border rounded-xl shadow-xl overflow-hidden mb-6">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-kingshot-dark/50 border-b border-kingshot-border uppercase text-slate-400 gaming-font">
                            <th class="py-2.5 px-2 text-center">Order</th>
                            <th class="py-2.5 px-3">Player & March</th>
                            <th class="py-2.5 px-3 text-center">Schedule (Launch / Arrival)</th>
                            <th class="py-2.5 px-3 text-center">Status</th>
                            <th class="py-2.5 px-3 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-kingshot-border/60"></tbody>
                </table>
            </div>
            <div id="empty-state" class="p-6 text-center text-xs text-slate-500">No players added yet.</div>
        </div>

    </main>

    <script>
        const CONFIG = {
            supabaseUrl: "https://rdadphlhonsoqghwwaua.supabase.co",
            anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkYWRwaGxob25zb3FnaHd3YXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTIwNTMsImV4cCI6MjEwNjA4ODA1M30.mRwVaIH7RGl01rjntardLs8DyZIo0A0KYXqNNW0tJak", 
            roomCode: "1865"
        };

        let supabaseClient = null;
        let currentChannel = null;
        let currentRole = ''; 
        let backgroundAudioCtx = null;
        let audioUnlocked = false;
        const LEADER_PASSWORD = "123";

        let state = {
            players: JSON.parse(localStorage.getItem('kingshot_players_v629') || '[]'),
            groupSettings: JSON.parse(localStorage.getItem('kingshot_group_settings_v629') || '{}')
        };

        let battleEngine = {
            queue: [],
            currentIndex: 0,
            timerInterval: null
        };

        let speechQueue = [];
        let isSpeaking = false;

        window.addEventListener('DOMContentLoaded', () => {
            checkRolePrompt();

            try {
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.anonKey);
                    currentChannel = supabaseClient.channel('room_' + CONFIG.roomCode);

                    currentChannel.on('broadcast', { event: 'battle_event' }, (payload) => {
                        handleBroadcastEvent(payload.payload);
                    }).subscribe((status) => {
                        const indicator = document.getElementById('connection-status');
                        if (status === 'SUBSCRIBED') {
                            if(indicator) {
                                indicator.classList.remove('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
                                indicator.classList.add('bg-emerald-500', 'shadow-[0_0_8px_rgba(16,185,129,0.8)]');
                            }
                        } else {
                            if(indicator) {
                                indicator.classList.remove('bg-emerald-500', 'shadow-[0_0_8px_rgba(16,185,129,0.8)]');
                                indicator.classList.add('bg-red-500', 'shadow-[0_0_8px_rgba(239,68,68,0.8)]');
                            }
                        }
                    });
                }
            } catch(e) {
                console.error("Connection error", e);
            }
        });

        function checkRolePrompt() {
            const modal = document.getElementById('role-modal');
            currentRole = ''; 
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        window.handleRoleSelection = function(role) {
            if (role === 'leader') {
                const pass = prompt("🔐 Please enter leader password:");
                if (pass !== LEADER_PASSWORD) {
                    alert("❌ Incorrect password!");
                    return;
                }
            }
            currentRole = role;
            const modal = document.getElementById('role-modal');
            if (modal) {
                modal.classList.add('hidden');
            }
            applyRoleUI(role);
            unlockAudioMobile();
        }

        window.resetRoleSelection = function() {
            currentRole = '';
            const modal = document.getElementById('role-modal');
            if (modal) {
                modal.classList.remove('hidden');
            }
        }

        function applyRoleUI(role) {
            const roleBadge = document.getElementById('current-role-badge');
            if(roleBadge) roleBadge.textContent = `Role: ${role.toUpperCase()}`;
            
            document.querySelectorAll('.leader-only').forEach(el => {
                if (role === 'player') {
                    el.classList.add('hidden');
                } else {
                    el.classList.add('block');
                    el.classList.remove('hidden');
                }
            });
        }

        window.unlockAudioMobile = function() {
            if (audioUnlocked) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!backgroundAudioCtx) {
                    backgroundAudioCtx = new AudioContext();
                }
                if (backgroundAudioCtx.state === 'suspended') {
                    backgroundAudioCtx.resume();
                }
                const buffer = backgroundAudioCtx.createBuffer(1, 1, 22050);
                const source = backgroundAudioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(backgroundAudioCtx.destination);
                source.start(0);

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const dummyUtter = new SpeechSynthesisUtterance('');
                    window.speechSynthesis.speak(dummyUtter);
                }

                audioUnlocked = true;
                const btn = document.getElementById('enable-audio-btn');
                if(btn) {
                    btn.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 flex items-center gap-1.5 shadow-md transition-all whitespace-nowrap cursor-pointer";
                    btn.innerHTML = "🎧 Audio Unlocked";
                }
            } catch(e) {}
        }

        window.enableAndTestAudio = function(e) {
            if(e) e.stopPropagation();
            unlockAudioMobile();
            speakText("Audio is active", true);
        };

        window.speakCustomText = function(text) {
            broadcastState('CUSTOM_AUDIO', { text: text });
        };

        function broadcastState(eventType, data) {
            const payload = { type: eventType, data: data };
            if (currentChannel) {
                try {
                    currentChannel.send({
                        type: 'broadcast',
                        event: 'battle_event',
                        payload: payload
                    });
                } catch(e) {}
            }
            handleEventLocally(payload);
        }

        function handleBroadcastEvent(msg) {
            if (currentRole === 'leader') return;
            handleEventLocally(msg);
        }

        function handleEventLocally(msg) {
            if (msg.type === 'START_SEQUENCE') {
                updateLiveUI(msg.data.currentLauncher, msg.data.secs, msg.data.isPrep);
                renderBattleQueueUI(msg.data.currentIndex, msg.data.queue);

                if (msg.data.isPrep) {
                    if (msg.data.secs > 0) {
                        speakText(String(msg.data.secs), true);
                    }
                } else if (msg.data.currentLauncher) {
                    if (msg.data.secs > 0) {
                        speakText(String(msg.data.secs), true);
                    } else if (msg.data.secs === 0) {
                        speakText(msg.data.currentLauncher.name, true);
                    }
                }
            } else if (msg.type === 'CUSTOM_AUDIO') {
                speakText(msg.data.text, true);
                const targetDiv = document.getElementById('battle-current-target');
                if(targetDiv) targetDiv.innerHTML = `📢 <span class="text-indigo-400 font-bold">${msg.data.text}</span>`;
            } else if (msg.type === 'RESET') {
                clearSpeechQueue();
                resetBattleEngineUI();
            }
        }

        function speakText(text, urgent = false) {
            if (!('speechSynthesis' in window)) return;
            
            if (urgent) {
                speechQueue = [];
                isSpeaking = false;
                window.speechSynthesis.cancel();
            }

            speechQueue.push(String(text));
            processSpeechQueue();
        }

        function processSpeechQueue() {
            if (isSpeaking || speechQueue.length === 0) return;
            isSpeaking = true;
            const text = speechQueue.shift();

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95; 
                utterance.pitch = 1.0; 
                utterance.volume = 1.0;
                
                utterance.onend = () => {
                    isSpeaking = false;
                    setTimeout(processSpeechQueue, 30);
                };
                
                utterance.onerror = () => {
                    isSpeaking = false;
                    setTimeout(processSpeechQueue, 30);
                };
                
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                isSpeaking = false;
                setTimeout(processSpeechQueue, 30);
            }
        }

        function clearSpeechQueue() {
            speechQueue = [];
            isSpeaking = false;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function calculateSchedule() {
            let activePlayers = state.players.filter(p => !p.frozen);
            if (activePlayers.length === 0) return [];

            let mapped = activePlayers.map(p => ({
                id: p.id,
                name: p.name,
                group: String(p.group),
                marchSec: (p.marchMins * 60) + p.marchSecs
            }));

            let maxMarch = Math.max(...mapped.map(m => m.marchSec));
            let uniqueGroups = [...new Set(mapped.map(m => m.group))];

            let groupArrivals = {};
            let currentBaseArrival = maxMarch;

            uniqueGroups.forEach((g, idx) => {
                let settings = state.groupSettings[g] || { mode: 'staggered', gap: 1 };
                
                if (idx === 0) {
                    groupArrivals[g] = currentBaseArrival;
                } else {
                    let prevGroup = uniqueGroups[idx - 1];
                    let prevSettings = state.groupSettings[prevGroup] || { mode: 'staggered', gap: 1 };
                    
                    let transitionGap = prevSettings.gap || 2;
                    groupArrivals[g] = groupArrivals[prevGroup] + transitionGap;
                }
            });

            let playerArrivals = {};
            
            uniqueGroups.forEach(g => {
                let gPlayers = mapped.filter(m => m.group === g);
                let settings = state.groupSettings[g] || { mode: 'staggered', gap: 1 };

                if (settings.mode === 'simultaneous') {
                    let targetTime = groupArrivals[g];
                    gPlayers.forEach(p => {
                        playerArrivals[p.id] = targetTime;
                    });
                } else {
                    let baseTime = groupArrivals[g];
                    let intraGap = settings.gap || 1;
                    gPlayers.forEach((p, pIdx) => {
                        playerArrivals[p.id] = baseTime + (pIdx * intraGap);
                    });
                }
            });

            let targetArrivals = mapped.map(m => playerArrivals[m.id]);
            let rawLaunches = mapped.map((m, index) => targetArrivals[index] - m.marchSec);
            let minLaunch = Math.min(...rawLaunches);
            let delays = rawLaunches.map(l => l - minLaunch);

            let calculated = mapped.map((m, index) => ({
                id: m.id,
                name: m.name,
                group: m.group,
                marchSec: m.marchSec,
                arrivalSec: targetArrivals[index],
                delay: delays[index]
            }));

            // الترتيب تلقائياً حسب وقت الإطلاق (Delay) من الصغير للكبير (الأول فالأول في العد التنازلي)
            calculated.sort((a, b) => a.delay - b.delay);

            return calculated;
        }

        const startBtn = document.getElementById('start-battle-btn');
        if(startBtn) {
            startBtn.addEventListener('click', () => {
                clearSpeechQueue();
                let schedule = calculateSchedule();
                if (schedule.length === 0) return alert('No active players found!');

                const selectedWave = document.getElementById('battle-wave-select').value;
                let queue = schedule.filter(s => selectedWave === 'all' || s.group === selectedWave);

                if (queue.length === 0) return alert('No players in this wave!');

                battleEngine.queue = queue;
                battleEngine.currentIndex = 0;

                let prepRemaining = 3;
                if (battleEngine.timerInterval) clearInterval(battleEngine.timerInterval);

                broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: 0, currentLauncher: battleEngine.queue[0], secs: prepRemaining, isPrep: true });
                prepRemaining--;

                battleEngine.timerInterval = setInterval(() => {
                    if (prepRemaining > 0) {
                        broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: 0, currentLauncher: battleEngine.queue[0], secs: prepRemaining, isPrep: true });
                        prepRemaining--;
                    } else {
                        clearInterval(battleEngine.timerInterval);
                        runSequentialTimer();
                    }
                }, 1000);
            });
        }

        function runSequentialTimer() {
            if (battleEngine.currentIndex >= battleEngine.queue.length) {
                broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: -1, currentLauncher: null, secs: 0, isPrep: false });
                return;
            }

            const currentLauncher = battleEngine.queue[battleEngine.currentIndex];
            let prevDelay = battleEngine.currentIndex === 0 ? 0 : battleEngine.queue[battleEngine.currentIndex - 1].delay;
            let waitTime = currentLauncher.delay - prevDelay;

            if (waitTime <= 0) {
                broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: battleEngine.currentIndex, currentLauncher: currentLauncher, secs: 0, isPrep: false });
                battleEngine.currentIndex++;
                setTimeout(runSequentialTimer, 1000); 
            } else {
                let remaining = waitTime;
                
                broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: battleEngine.currentIndex, currentLauncher: currentLauncher, secs: remaining, isPrep: false });
                remaining--;

                if (battleEngine.timerInterval) clearInterval(battleEngine.timerInterval);
                battleEngine.timerInterval = setInterval(() => {
                    broadcastState('START_SEQUENCE', { queue: battleEngine.queue, currentIndex: battleEngine.currentIndex, currentLauncher: currentLauncher, secs: remaining, isPrep: false });
                    
                    if (remaining === 0) {
                        clearInterval(battleEngine.timerInterval);
                        battleEngine.currentIndex++;
                        setTimeout(runSequentialTimer, 1000);
                    } else {
                        remaining--;
                    }
                }, 1000);
            }
        }

        function updateLiveUI(launcher, secs, isPrep) {
            if (!launcher && !isPrep) return;
            const statusDiv = document.getElementById('battle-status');
            const targetDiv = document.getElementById('battle-current-target');
            if(!statusDiv || !targetDiv) return;
            
            statusDiv.textContent = 'STATUS: LIVE SEQUENCE IN PROGRESS';
            statusDiv.className = "text-[10px] uppercase tracking-wider text-emerald-400 font-bold animate-pulse";

            if (isPrep) {
                targetDiv.innerHTML = `⚠️ PREP: <span class="text-amber-400 text-xl">${secs}s</span>`;
            } else if (secs > 0) {
                targetDiv.innerHTML = `⏳ <b class="text-white">${launcher.name}</b> (G${launcher.group}) in: <span class="text-cyan-400 text-xl">${secs}s</span>`;
            } else {
                targetDiv.innerHTML = `🔥 <span class="text-white underline font-extrabold text-xl">${launcher.name}</span> LAUNCH! 🔥`;
            }
        }

        const resetBtn = document.getElementById('reset-battle-btn');
        if(resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (battleEngine.timerInterval) clearInterval(battleEngine.timerInterval);
                broadcastState('RESET', {});
            });
        }

        function resetBattleEngineUI() {
            const statusDiv = document.getElementById('battle-status');
            const targetDiv = document.getElementById('battle-current-target');
            if(!statusDiv || !targetDiv) return;
            statusDiv.textContent = "STATUS: STANDBY";
            statusDiv.className = "text-[10px] uppercase tracking-wider text-slate-400 font-bold";
            targetDiv.textContent = "Waiting for Leader...";
            document.getElementById('battle-sequence-list').innerHTML = '';
        }

        function renderBattleQueueUI(activeIndex, queueList) {
            const container = document.getElementById('battle-sequence-list');
            if(!container || !queueList) return;
            let html = '';
            queueList.forEach((item, idx) => {
                let badge = idx < activeIndex || activeIndex === -1 ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : (idx === activeIndex ? 'bg-amber-500/20 text-amber-400 font-bold border-amber-500' : 'bg-kingshot-dark text-slate-400 border-kingshot-border');
                html += `<div class="flex items-center justify-between p-2.5 rounded-lg border text-xs ${badge}"><span>#${idx+1} ${item.name} (G${item.group})</span><span class="font-bold">${idx === activeIndex ? '🔥 LAUNCH' : 'Pending'}</span></div>`;
            });
            container.innerHTML = html;
        }

        const addPlayerForm = document.getElementById('add-player-form');
        if(addPlayerForm) {
            addPlayerForm.addEventListener('submit', function(e) {
                e.preventDefault(); 
                const editId = document.getElementById('edit-player-id').value;
                const name = document.getElementById('player-name').value.trim();
                const group = document.getElementById('player-group').value.trim();
                const mins = parseInt(document.getElementById('march-mins').value) || 0;
                const secs = parseInt(document.getElementById('march-secs').value) || 0;
                if (!name) return;

                if (editId) {
                    let p = state.players.find(p => p.id === editId);
                    if (p) { p.name = name; p.group = group; p.marchMins = mins; p.marchSecs = secs; }
                    cancelEdit();
                } else {
                    state.players.push({ id: Date.now().toString(), name, group, marchMins: mins, marchSecs: secs, frozen: false });
                }
                savePlayers(); renderPlayerTable(); renderGroupSettingsUI(); this.reset();
            });
        }

        window.editPlayer = function(id) {
            const p = state.players.find(item => item.id === id);
            if (!p) return;
            document.getElementById('edit-player-id').value = p.id;
            document.getElementById('player-name').value = p.name;
            document.getElementById('player-group').value = p.group;
            document.getElementById('march-mins').value = p.marchMins;
            document.getElementById('march-secs').value = p.marchSecs;
            
            document.getElementById('form-title').textContent = 'Edit Player';
            document.getElementById('form-submit-btn').textContent = 'Update Player';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            document.getElementById('edit-player-id').value = '';
            document.getElementById('add-player-form').reset();
            document.getElementById('form-title').textContent = 'Add Player';
            document.getElementById('form-submit-btn').textContent = 'Add Player';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        window.movePlayer = function(id, direction) {
            const index = state.players.findIndex(p => p.id === id);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= state.players.length) return;

            const temp = state.players[index];
            state.players[index] = state.players[newIndex];
            state.players[newIndex] = temp;

            savePlayers();
            renderPlayerTable();
        }

        function renderGroupSettingsUI() {
            const container = document.getElementById('group-settings-container');
            if (!container) return;
            
            const groups = [...new Set(state.players.map(p => p.group))];
            if (groups.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-500">Add players to configure group settings.</div>';
                return;
            }

            let html = '';
            groups.forEach(g => {
                let setting = state.groupSettings[g] || { mode: 'staggered', gap: 1 };
                html += `
                    <div class="bg-kingshot-dark p-2.5 rounded-lg border border-kingshot-border flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-200">Group ${g}</span>
                            <select onchange="updateGroupMode('${g}', this.value)" class="bg-kingshot-card border border-kingshot-border rounded px-2 py-1 text-[11px] text-slate-200 outline-none">
                                <option value="staggered" ${setting.mode === 'staggered' ? 'selected' : ''}>Staggered (Sequential)</option>
                                <option value="simultaneous" ${setting.mode === 'simultaneous' ? 'selected' : ''}>Simultaneous (All Together)</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] text-slate-400">Gap / Interval (Secs):</span>
                            <input type="number" min="0" value="${setting.gap}" onchange="updateGroupGap('${g}', this.value)" class="w-20 bg-kingshot-card border border-kingshot-border rounded px-2 py-1 text-[11px] text-slate-100 outline-none text-center">
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.updateGroupMode = function(group, mode) {
            if (!state.groupSettings[group]) state.groupSettings[group] = { mode: 'staggered', gap: 1 };
            state.groupSettings[group].mode = mode;
            saveGroupSettings();
            renderPlayerTable();
        }

        window.updateGroupGap = function(group, gap) {
            if (!state.groupSettings[group]) state.groupSettings[group] = { mode: 'staggered', gap: 1 };
            state.groupSettings[group].gap = parseInt(gap) || 0;
            saveGroupSettings();
            renderPlayerTable();
        }

        function renderPlayerTable() {
            const tbody = document.getElementById('player-table-body');
            const emptyState = document.getElementById('empty-state');
            if(!tbody) return; tbody.innerHTML = '';
            
            let schedule = calculateSchedule();
            let scheduleMap = {};
            schedule.forEach(s => { scheduleMap[s.id] = s; });

            if (state.players.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                state.players.forEach((p, i) => {
                    let calc = scheduleMap[p.id];
                    let calcText = p.frozen ? '<span class="text-slate-500">Frozen</span>' : (calc ? `Launch: <b class="text-cyan-400">+${calc.delay}s</b><br>Arrival: <b class="text-amber-400">${calc.arrivalSec}s</b>` : '-');
                    
                    tbody.innerHTML += `
                        <tr class="border-b border-kingshot-border/60 hover:bg-slate-800/35 transition-colors ${p.frozen ? 'opacity-50 bg-blue-950/25' : ''}">
                            <td class="py-3 px-2 text-center text-amber-400 font-bold text-[10px]">#${i+1}</td>
                            <td class="py-3 px-3 text-white font-semibold">G${p.group} - ${p.name} <br><span class="text-[10px] text-slate-400 font-normal">March: ${p.marchMins}m ${p.marchSecs}s</span></td>
                            <td class="py-3 px-3 text-center text-[11px]">${calcText}</td>
                            <td class="py-3 px-3 text-center">
                                <button onclick="toggleFreeze('${p.id}')" class="px-2.5 py-1 rounded-md text-[10px] font-semibold border transition-all cursor-pointer ${p.frozen ? 'text-blue-400 border-blue-500/40 bg-blue-500/10' : 'text-emerald-400 border-emerald-500/40 bg-emerald-500/10'}">${p.frozen ? 'Frozen' : 'Active'}</button>
                            </td>
                            <td class="py-3 px-3 text-center">
                                <div class="flex items-content justify-center gap-1">
                                    <button onclick="movePlayer('${p.id}', -1)" class="bg-slate-700/60 hover:bg-slate-600 text-white px-2 py-1 rounded text-[10px] transition-all cursor-pointer" title="Move Up">⬆️</button>
                                    <button onclick="movePlayer('${p.id}', 1)" class="bg-slate-700/60 hover:bg-slate-600 text-white px-2 py-1 rounded text-[10px] transition-all cursor-pointer" title="Move Down">⬇️</button>
                                    <button onclick="editPlayer('${p.id}')" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 border border-blue-500/40 px-2.5 py-1 rounded text-[10px] transition-all font-semibold cursor-pointer">Edit</button>
                                    <button onclick="deletePlayer('${p.id}')" class="bg-red-500/10 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-2.5 py-1 rounded text-[10px] transition-all font-semibold cursor-pointer">Del</button>
                                    </div>
                            </td>
                        </tr>`;
                });
            }
            updateWaveSelect();
            renderGroupSettingsUI();
        }

        window.toggleFreeze = function(id) { 
            let p = state.players.find(i => id === i.id); 
            if (p) { p.frozen = !p.frozen; savePlayers(); renderPlayerTable(); } 
        };
        
        window.deletePlayer = function(id) { 
            state.players = state.players.filter(i => i.id !== id); 
            savePlayers(); 
            renderPlayerTable(); 
        };

        function updateWaveSelect() {
            const s = document.getElementById('battle-wave-select'); if(!s) return;
            const groups = [...new Set(state.players.map(p => p.group))];
            s.innerHTML = '<option value="all">All Active Players</option>' + groups.map(g => `<option value="${g}">Group ${g}</option>`).join('');
        }

        function savePlayers() { localStorage.setItem('kingshot_players_v629', JSON.stringify(state.players)); }
        function saveGroupSettings() { localStorage.setItem('kingshot_group_settings_v629', JSON.stringify(state.groupSettings)); }
        
        renderPlayerTable();
    </script>
</body>
</html>
