<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Shot - Command & Control</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .hidden { display: none !important; }
        .card { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(255,255,255,0.1); }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .danger { background: #dc3545; }
        .danger:hover { background: #a71d2a; }
    </style>
</head>
<body>

    <!-- نافذة اختيار الوضع / تسجيل الدخول -->
    <div id="auth-screen" class="card">
        <h2>King Shot - Authentication</h2>
        <div id="role-selection">
            <button onclick="selectRole('leader')">Login as Leader</button>
            <button onclick="selectRole('member')" style="background: #28a745;">Join as Member</button>
        </div>

        <div id="leader-login-form" class="hidden">
            <h3>Leader Secure Login</h3>
            <input type="email" id="email" placeholder="Enter Leader Email">
            <input type="password" id="password" placeholder="Enter Password">
            <button onclick="loginLeader()">Login</button>
            <button onclick="backToRoles()" style="background: #6c757d;">Back</button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية للتطبيق -->
    <div id="app-screen" class="card hidden">
        <h2 id="app-title">Dashboard</h2>
        <p id="user-status"></p>
        <button id="action-btn" onclick="triggerAction()">Send Command / Audio</button>
        <button class="danger" onclick="logout()">Logout / Switch Role</button>
    </div>

    <script>
        // إعدادات Supabase (تأكد من مطابقتها لبيانات مشروعك)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRole = null;
        let speechQueue = [];
        let isSpeaking = false;

        // متغيرات لمنع تكرار الصوت (صدى الصوت / الدبلجة)
        let lastSpokenText = '';
        let lastSpokenTime = 0;

        // التحقق من الجلسة عند فتح التطبيق مع فرض تسجيل الخروج السابق لضمان ظهور شاشة الدخول
        window.addEventListener('DOMContentLoaded', async () => {
            await supabaseClient.auth.signOut(); // إجبار المتصفح على عدم الحفظ التلقائي للاختبار
        });

        function selectRole(role) {
            currentRole = role;
            if (role === 'leader') {
                document.getElementById('role-selection').classList.add('hidden');
                document.getElementById('leader-login-form').classList.remove('hidden');
            } else {
                // دخول العضو مباشرة بدون باسورد
                startApp('Member Mode');
            }
        }

        function backToRoles() {
            document.getElementById('leader-login-form').classList.add('hidden');
            document.getElementById('role-selection').classList.remove('hidden');
        }

        async function loginLeader() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Login Failed: ' + error.message);
            } else {
                startApp('Leader: ' + data.user.email);
            }
        }

        function startApp(statusText) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-status').innerText = statusText;
            
            // تجربة نطق ترحيبية لمنع ابتلاع الكلمة الأولى وتفعيل المحرك
            speakText("System Ready");
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentRole = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('leader-login-form').classList.add('hidden');
            document.getElementById('role-selection').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        }

        // دالة نطق النصوص مع حماية الصدى والتكرار وتلافي ابتلاع الكلمة الأولى
        function speakText(text, urgent = false) {
            if (!('speechSynthesis' in window)) return;
            
            const cleanText = String(text).trim();
            const now = Date.now();
            
            // منع تكرار نفس النص خلال أقل من ثانيتين لمنع الدبلجة والصدى
            if (cleanText === lastSpokenText && (now - lastSpokenTime) < 2000) {
                return;
            }
            lastSpokenText = cleanText;
            lastSpokenTime = now;

            if (urgent) {
                speechQueue = [];
                isSpeaking = false;
                window.speechSynthesis.cancel();
            }
            
            speechQueue.push(cleanText);
            processSpeechQueue();
        }

        function processSpeechQueue() {
            if (isSpeaking || speechQueue.length === 0) return;
            isSpeaking = true;
            const text = speechQueue.shift();

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.90; // إبطاء السرعة قليلاً لضمان وضوح نطق جميع الكلمات (مثل لورد وأليكس)
                utterance.volume = 1.0;
                
                utterance.onend = () => { 
                    isSpeaking = false; 
                    setTimeout(processSpeechQueue, 150); 
                };
                utterance.onerror = () => { 
                    isSpeaking = false; 
                    setTimeout(processSpeechQueue, 150); 
                };
                
                // تأخير بسيط جداً يمنع ابتلاع الكلمة الأولى عند بدء النطق
                setTimeout(() => {
                    window.speechSynthesis.speak(utterance);
                }, 80);

            } catch (e) {
                isSpeaking = false;
                setTimeout(processSpeechQueue, 150);
            }
        }

        function triggerAction() {
            // مثال لاختبار النطق المباشر عند الضغط
            speakText("Lord and Alex, get ready");
        }
    </script>
</body>
</html>
