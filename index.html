<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 1865</title>
    
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* التنسيق الأساسي المرتب */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center; /* توسيط الشاشة بالكامل */
        }
        
        .container {
            width: 100%;
            max-width: 500px; /* مقاس مثالي للجوال والكمبيوتر */
            text-align: center;
        }

        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1e1e1e; padding: 15px 25px; border-radius: 10px; 
            margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .status-light { 
            width: 20px; height: 20px; border-radius: 50%; 
            background-color: red; box-shadow: 0 0 10px red; transition: 0.3s; 
        }
        .status-light.connected { 
            background-color: #00ff00; box-shadow: 0 0 15px #00ff00; 
        }
        
        /* الأزرار بشكلها الجميل السابق */
        .btn { 
            background: #6200ea; color: white; border: none; 
            padding: 15px; font-size: 18px; border-radius: 8px; 
            cursor: pointer; margin: 10px 0; transition: 0.3s; font-weight: bold; 
            width: 100%; display: block;
        }
        .btn:hover { background: #7c4dff; transform: scale(1.02); }
        
        .btn-leader { background: #ff9800; color: white; }
        .btn-leader:hover { background: #ffb74d; }
        
        .btn-danger { background: #d50000; }
        .btn-danger:hover { background: #ff1744; }
        
        .card { 
            background: #1e1e1e; padding: 25px; border-radius: 10px; 
            margin-top: 15px; box-sizing: border-box; text-align: center;
        }
        
        input { 
            padding: 15px; font-size: 16px; border-radius: 5px; 
            border: 1px solid #333; margin-bottom: 15px; width: 100%; 
            text-align: center; box-sizing: border-box; background: #2c2c2c; color: white;
        }
        
        #log {
            color: #bbb; height: 150px; overflow-y: auto; text-align: left; 
            background: #000; padding: 15px; border-radius: 5px; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1️⃣ Welcome Screen -->
    <div id="welcomeScreen" class="screen active-screen">
        <h2 style="margin-bottom: 30px;">Welcome to Room 1865 🎮</h2>
        <p style="margin-bottom: 20px; color: #ccc;">Please select your role:</p>
        <button class="btn" onclick="joinAsPlayer()">🎮 I am a Player</button>
        <button class="btn btn-leader" onclick="showPasswordScreen()">👑 I am the Leader</button>
    </div>

    <!-- 2️⃣ Password Screen -->
    <div id="passwordScreen" class="screen">
        <h2 style="margin-bottom: 20px;">🔒 Leader Login</h2>
        <p style="color: #ccc;">Enter the leader password:</p>
        <input type="password" id="adminPassword" placeholder="Password...">
        <button class="btn btn-leader" onclick="checkPassword()">Login</button>
        <button class="btn btn-danger" onclick="goBack()">🔙 Back</button>
    </div>

    <!-- 3️⃣ Main Room Screen -->
    <div id="mainRoomScreen" class="screen">
        <div class="header">
            <h2 id="roleTitle" style="margin: 0; font-size: 1.2rem;">ROOM: 1865</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="statusText" style="font-weight: bold; font-size: 14px;">Connecting...</span>
                <div id="statusLight" class="status-light"></div>
            </div>
        </div>

        <!-- Leader Controls -->
        <div id="leaderControls" class="card" style="display: none;">
            <h3 style="margin-top: 0;">👑 Leader Panel</h3>
            <input type="text" id="playerName" placeholder="Enter player name...">
            <button class="btn" onclick="sendName()">📢 Call Name</button>
            <button class="btn btn-danger" onclick="sendCountdown()">⏱️ Start Countdown</button>
        </div>

        <!-- Player View -->
        <div id="playerView" class="card" style="display: none; background: #004d40;">
            <h3 style="margin-top: 0;">🎧 Player Mode</h3>
            <p style="color: #ccc;">Waiting for leader commands...</p>
        </div>

        <!-- Event Log -->
        <div class="card" style="margin-top: 20px;">
            <h3 style="margin-top: 0;">📜 Event Log</h3>
            <div id="log"></div>
        </div>
    </div>

</div>

    <script>
        const SECRET_PASSWORD = "123"; 

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function goBack() {
            showScreen('welcomeScreen');
            document.getElementById('adminPassword').value = ''; 
        }

        function showPasswordScreen() {
            showScreen('passwordScreen');
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === SECRET_PASSWORD) {
                joinAsLeader();
            } else {
                alert("❌ Wrong password!");
            }
        }

        function joinAsPlayer() {
            showScreen('mainRoomScreen');
            document.getElementById('roleTitle').innerText = "Player 🎮";
            document.getElementById('playerView').style.display = "block";
            document.getElementById('leaderControls').style.display = "none";
            startSupabase();
            speakText("Joined the room");
        }

        function joinAsLeader() {
            showScreen('mainRoomScreen');
            document.getElementById('roleTitle').innerText = "Leader 👑";
            document.getElementById('leaderControls').style.display = "block";
            document.getElementById('playerView').style.display = "none";
            startSupabase();
        }

        let roomChannel;
        
        function startSupabase() {
            try {
                const CONFIG = {
                    supabaseUrl: "https://rdadphlhonsoqghwwaua.supabase.co",
                    anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkYWRwaGxob25zb3FnaHd3YXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTIwNTMsImV4cCI6MjEwNjA4ODA1M30.mRwVaIH7RGl01rjntardLs8DyZIo0A0KYXqNNW0tJak",
                    roomCode: "1865"
                };

                const supabase = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.anonKey);
                roomChannel = supabase.channel('room_' + CONFIG.roomCode);

                roomChannel
                    .on('broadcast', { event: 'action' }, (payload) => {
                        const data = payload.payload;
                        if (data.type === 'name') {
                            addLog(`🔊 Calling player: ${data.name}`);
                            speakText(data.name);
                        } 
                        else if (data.type === 'countdown') {
                            addLog(`⏱️ Countdown started!`);
                            playCountdown();
                        }
                    })
                    .subscribe((status) => {
                        if (status === 'SUBSCRIBED') {
                            document.getElementById('statusLight').classList.add('connected');
                            document.getElementById('statusText').innerText = "Connected 🟢";
                            document.getElementById('statusText').style.color = "#00ff00";
                            addLog("✅ Successfully connected!");
                        }
                    });
            } catch (error) {
                console.error("Supabase Error:", error);
                addLog("⚠️ Connection error.");
            }
        }

        function sendName() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert("⚠️ Please enter a player name first!");
            
            if (roomChannel) {
                roomChannel.send({ type: 'broadcast', event: 'action', payload: { type: 'name', name: name } });
                addLog(`📤 Sent call command for: ${name}`);
            }
        }

        function sendCountdown() {
            if (roomChannel) {
                roomChannel.send({ type: 'broadcast', event: 'action', payload: { type: 'countdown' } });
                addLog(`📤 Sent countdown command`);
            }
        }

        function addLog(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('en-US');
            logDiv.innerHTML += `<p style="margin: 5px 0; border-bottom: 1px solid #333; padding-bottom: 5px;">[${time}] ${msg}</p>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function speakText(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        function playCountdown() {
            let count = 5;
            const interval = setInterval(() => {
                if (count > 0) {
                    speakText(count.toString());
                    count--;
                } else {
                    clearInterval(interval);
                    speakText("Go!"); 
                }
            }, 1000);
        }
    </script>
</body>
</html>
