<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الغرفة - 1865</title>
    
    <!-- مكتبة سوبابيز -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #fff; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        /* إعدادات الشاشات المخفية والظاهرة */
        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #1e1e1e; padding: 15px 30px; border-radius: 10px; 
            margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-light { 
            width: 20px; height: 20px; border-radius: 50%; 
            background-color: red; box-shadow: 0 0 10px red; transition: 0.3s; 
        }
        .status-light.connected { 
            background-color: #00ff00; box-shadow: 0 0 15px #00ff00; 
        }
        
        .btn { 
            background: #6200ea; color: white; border: none; 
            padding: 15px 30px; font-size: 18px; border-radius: 8px; 
            cursor: pointer; margin: 10px; transition: 0.3s; font-weight: bold; width: 80%; max-width: 300px;
        }
        .btn:hover { background: #7c4dff; transform: scale(1.05); }
        .btn-leader { background: #ff9800; }
        .btn-leader:hover { background: #ffb74d; }
        .btn-danger { background: #d50000; }
        .btn-danger:hover { background: #ff1744; }
        
        .card { 
            background: #1e1e1e; padding: 20px; border-radius: 10px; 
            display: inline-block; margin-top: 10px; width: 90%; max-width: 500px;
        }
        input { 
            padding: 12px; font-size: 16px; border-radius: 5px; 
            border: 1px solid #333; margin-bottom: 15px; width: 90%; text-align: center;
        }
        #log {
            color: #bbb; height: 150px; overflow-y: auto; text-align: right; 
            background: #000; padding: 15px; border-radius: 5px; font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 1️⃣ شاشة البداية (اختيار لاعب أو قائد) -->
    <!-- ========================================== -->
    <div id="welcomeScreen" class="screen active-screen">
        <h2>أهلاً بك في غرفة 1865 🎮</h2>
        <p>الرجاء اختيار دورك للدخول:</p>
        <button class="btn" onclick="joinAsPlayer()">🎮 أنا لاعب (Player)</button>
        <br>
        <button class="btn btn-leader" onclick="showPasswordScreen()">👑 أنا القائد (Leader)</button>
    </div>

    <!-- ========================================== -->
    <!-- 2️⃣ شاشة كلمة المرور للقائد -->
    <!-- ========================================== -->
    <div id="passwordScreen" class="screen">
        <h2>🔒 دخول القائد</h2>
        <p>أدخل كلمة المرور الخاصة بالقائد:</p>
        <input type="password" id="adminPassword" placeholder="كلمة المرور...">
        <br>
        <button class="btn btn-leader" onclick="checkPassword()">دخول</button>
        <button class="btn btn-danger" onclick="goBack()">🔙 رجوع</button>
    </div>

    <!-- ========================================== -->
    <!-- 3️⃣ شاشة الغرفة (تظهر للاعب والقائد باختلافات) -->
    <!-- ========================================== -->
    <div id="mainRoomScreen" class="screen">
        <div class="header">
            <h2 id="roleTitle">ROOM: 1865</h2>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="statusText" style="font-weight: bold;">جاري الاتصال...</span>
                <div id="statusLight" class="status-light"></div>
            </div>
        </div>

        <!-- لوحة التحكم (تظهر للقائد فقط) -->
        <div id="leaderControls" class="card" style="display: none;">
            <h3>👑 لوحة تحكم القائد</h3>
            <input type="text" id="playerName" placeholder="اكتب اسم اللاعب هنا...">
            <br>
            <button class="btn" onclick="sendName()">📢 نطق الاسم</button>
            <button class="btn btn-danger" onclick="sendCountdown()">⏱️ بدء العد التنازلي</button>
        </div>

        <!-- شاشة اللاعب (تظهر للاعب فقط) -->
        <div id="playerView" class="card" style="display: none; background: #004d40;">
            <h3>🎧 أنت الآن تستمع كلاعب</h3>
            <p>انتظر أوامر القائد...</p>
        </div>

        <!-- سجل الأحداث (يظهر للجميع) -->
        <div class="card" style="margin-top: 20px;">
            <h3>📜 سجل الأحداث</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        // كلمة المرور الخاصة بالقائد (تقدر تغيرها من هنا)
        const SECRET_PASSWORD = "123"; 

        // ==========================================
        // 🔴 إعدادات سوبابيز
        // ==========================================
        const CONFIG = {
            supabaseUrl: "https://rdadphlhonsoqghwwaua.supabase.co",
            anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkYWRwaGxob25zb3FnaHd3YXVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MTIwNTMsImV4cCI6MjEwNjA4ODA1M30.mRwVaIH7RGl01rjntardLs8DyZIo0A0KYXqNNW0tJak",
            roomCode: "1865"
        };

        const supabase = supabase.createClient(CONFIG.supabaseUrl, CONFIG.anonKey);
        const roomChannel = supabase.channel('room_' + CONFIG.roomCode);

        // ==========================================
        // 🔄 التنقل بين الشاشات
        // ==========================================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function goBack() {
            showScreen('welcomeScreen');
            document.getElementById('adminPassword').value = ''; // تفريغ كلمة المرور
        }

        function showPasswordScreen() {
            showScreen('passwordScreen');
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === SECRET_PASSWORD) {
                joinAsLeader();
            } else {
                alert("❌ كلمة المرور خاطئة!");
            }
        }

        // ==========================================
        // 🎮 دخول اللاعب
        // ==========================================
        function joinAsPlayer() {
            showScreen('mainRoomScreen');
            document.getElementById('roleTitle').innerText = "أنت لاعب 🎮";
            document.getElementById('playerView').style.display = "block";
            document.getElementById('leaderControls').style.display = "none";
            startSupabase();
            
            // تهيئة الصوت (لأن المتصفح يطلب تفاعل المستخدم أولاً)
            speakText("تم الدخول للغرفة");
        }

        // ==========================================
        // 👑 دخول القائد
        // ==========================================
        function joinAsLeader() {
            showScreen('mainRoomScreen');
            document.getElementById('roleTitle').innerText = "أنت القائد 👑";
            document.getElementById('leaderControls').style.display = "block";
            document.getElementById('playerView').style.display = "none";
            startSupabase();
        }

        // ==========================================
        // 📡 الاتصال بسوبابيز (يعمل للطرفين)
        // ==========================================
        function startSupabase() {
            roomChannel
                .on('broadcast', { event: 'action' }, (payload) => {
                    const data = payload.payload;
                    if (data.type === 'name') {
                        addLog(`🔊 نداء للاعب: ${data.name}`);
                        speakText(data.name);
                    } 
                    else if (data.type === 'countdown') {
                        addLog(`⏱️ بدء العد التنازلي!`);
                        playCountdown();
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('statusLight').classList.add('connected');
                        document.getElementById('statusText').innerText = "متصل 🟢";
                        document.getElementById('statusText').style.color = "#00ff00";
                    }
                });
        }

        // ==========================================
        // 📤 إرسال الأوامر (للقائد فقط)
        // ==========================================
        function sendName() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert("⚠️ اكتب اسم اللاعب أولاً!");
            
            roomChannel.send({ type: 'broadcast', event: 'action', payload: { type: 'name', name: name } });
            addLog(`📤 أرسلت أمر نداء لـ: ${name}`);
        }

        function sendCountdown() {
            roomChannel.send({ type: 'broadcast', event: 'action', payload: { type: 'countdown' } });
            addLog(`📤 أرسلت أمر العد التنازلي`);
        }

        // ==========================================
        // 🗣️ وظائف الصوت والسجل
        // ==========================================
        function addLog(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString('ar-SA');
            logDiv.innerHTML += `<p style="margin: 5px 0; border-bottom: 1px solid #333; padding-bottom: 5px;">[${time}] ${msg}</p>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function speakText(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA'; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        function playCountdown() {
            let count = 5;
            const interval = setInterval(() => {
                if (count > 0) {
                    speakText(count.toString());
                    count--;
                } else {
                    clearInterval(interval);
                    speakText("انطلق!");
                }
            }, 1000);
        }
    </script>
</body>
</html>
