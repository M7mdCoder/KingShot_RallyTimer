<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingshotLab v7.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-gamepad text-indigo-500 text-4xl mb-2"></i>
                <h1 class="text-2xl font-bold text-white">Welcome to KingshotLab</h1>
                <p class="text-sm text-slate-400 mt-1">Please sign in or register to continue</p>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition-colors shadow-lg shadow-indigo-600/20">
                    Sign In / Register
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="app-screen" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600/10 border border-indigo-500/20 p-2 rounded-lg text-indigo-400">
                    <i class="fa-solid fa-bolt text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">KingshotLab <span class="text-xs bg-indigo-500/20 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/30">v7.2</span></h1>
                    <p class="text-xs text-slate-400" id="user-display-email">Connected User</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-red-500/10 hover:text-red-400 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition-all">
                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Sign Out
            </button>
        </header>

        <!-- Main Workspace -->
        <main class="flex-1 max-w-5xl w-full mx-auto p-6 flex flex-col gap-6">
            <!-- Speech Control Box -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-microphone text-indigo-500"></i> Text-to-Speech Engine
                </h2>
                <div class="space-y-4">
                    <textarea id="speech-input" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="Type text here to speak cleanly without cutting words..."></textarea>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Fixed speech queue duplication & cut-off bug.</span>
                        <button onclick="speakText()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition-colors shadow-lg shadow-indigo-600/20 flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-volume-high"></i> Speak Text
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Script -->
    <script>
        // Check local storage for active session on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('kingshot_user_email');
            if (savedEmail) {
                showApp(savedEmail);
            }
        });

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            if (email) {
                localStorage.setItem('kingshot_user_email', email);
                showApp(email);
            }
        }

        function showApp(email) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display-email').textContent = email;
        }

        function handleLogout() {
            localStorage.removeItem('kingshot_user_email');
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('auth-email').value = '';
            document.getElementById('auth-password').value = '';
        }

        // Fixed Speech Synthesis Function (Prevents duplication & initial word skipping)
        function speakText() {
            const textInput = document.getElementById('speech-input');
            const text = textInput.value.trim();
            
            if (!text) return;
            
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech instantly to avoid overlaps/duplication
                window.speechSynthesis.cancel();

                // Small delay to ensure the synthesis engine resets properly (fixes missing first words like "Lord")
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 1.0;
                    utterance.pitch = 1.0;
                    
                    // Optional: Error handling
                    utterance.onerror = (e) => {
                        console.error('Speech synthesis error:', e);
                    };

                    window.speechSynthesis.speak(utterance);
                }, 50);
            } else {
                alert('Speech synthesis is not supported in this browser.');
            }
        }
    </script>
</body>
</html>
